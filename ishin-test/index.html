<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>どの家を選ぶ?50年の支払いくらべ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F0E8;--card:#FFFFFF;--ink:#111827;--muted:#5A6170;--line:rgba(17,24,39,.10);
 --gold:#8C6425;--gold-soft:#F3E9D6;--cyan:#5FBBD8;
 --ishin:#B3121F;--ishin-soft:#F8E8E9;--zeh:#3B5E8E;--zeh-soft:#E7EDF5;--low:#5E6370;--low-soft:#ECECEE;
 --elec:#D9A441;--maint:#8DB0CB;--sell:#2F9E6E;--on-build:#FFFFFF;--sellt:#1C7148;--navy:#0E1726;
 --sans:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
 --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F141C;--card:#171D27;--ink:#ECEEF2;--muted:#A3AAB7;--line:rgba(255,255,255,.10);
 --gold:#D9B26A;--gold-soft:#2B2416;--ishin:#FF6B78;--ishin-soft:#33191C;--zeh:#86A9DE;--zeh-soft:#1B2433;--low:#A9AEB9;--low-soft:#22262E;--on-build:#0F141C;--sellt:#5FD39E}}
:root[data-theme="dark"]{--bg:#0F141C;--card:#171D27;--ink:#ECEEF2;--muted:#A3AAB7;--line:rgba(255,255,255,.10);--gold:#D9B26A;--gold-soft:#2B2416;--ishin:#FF6B78;--ishin-soft:#33191C;--zeh:#86A9DE;--zeh-soft:#1B2433;--low:#A9AEB9;--low-soft:#22262E;--on-build:#0F141C;--sellt:#5FD39E}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
html{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;font-weight:400;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
.app{max-width:1120px;margin:0 auto;padding:20px 24px 40px;min-height:100vh;display:flex;flex-direction:column}
/* 上部バー */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:12px;background:none;border:0;padding:4px 0;cursor:pointer}
.brand b{font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:.06em}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.12em}
.steps-ind{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.steps-ind li{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);letter-spacing:.06em}
.steps-ind li::before{content:"";width:22px;height:2px;background:var(--line);border-radius:1px}
.steps-ind li.on{color:var(--ink)}.steps-ind li.on::before{background:var(--gold)}
@media (max-width:720px){.steps-ind li span{display:none}}
/* 見出し */
.eyebrow{font-size:12px;color:var(--gold);margin:0 0 10px;letter-spacing:.18em;font-weight:500}
h1{font-family:var(--serif);font-size:clamp(28px,4.2vw,42px);line-height:1.35;margin:0 0 10px;font-weight:700;letter-spacing:.02em}
.lead{color:var(--muted);margin:0 0 28px;max-width:640px;font-size:15px}
/* 家を選ぶ */
.picks{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:760px){.picks{grid-template-columns:repeat(3,1fr)}}
.pick{position:relative;border:0;background:var(--navy);border-radius:18px;padding:0;text-align:left;cursor:pointer;overflow:hidden;min-height:340px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.pick .ph{position:absolute;inset:0;margin:0;border-radius:0;aspect-ratio:auto}
.pick .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s cubic-bezier(.16,1,.3,1)}
.pick:hover .ph img{transform:scale(1.03)}
.pick::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,23,38,0) 30%,rgba(14,23,38,.86) 78%)}
.pick .txt{position:relative;z-index:1;padding:20px;color:#F4F0E8}
.pick h2{font-family:var(--serif);margin:0 0 2px;font-size:24px;line-height:1.3;font-weight:700;color:#fff}
.pick p{margin:0;color:rgba(244,240,232,.82);font-size:14px}
.pick .tagline{display:block;margin-top:12px;font-size:13px;color:#E9D3A6;letter-spacing:.06em}
.badge{position:absolute;left:14px;top:14px;z-index:1;background:var(--ishin);color:#fff;font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;letter-spacing:.04em}
/* パネル・棒 */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
.bars{display:grid;gap:18px}
.bar{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.bar .nm{font-weight:500;font-size:15px}
.bar .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.track{position:relative;height:40px;border-radius:8px;background:var(--bg);overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;border-radius:8px;display:flex;align-items:center;justify-content:flex-end;padding-right:14px;color:var(--on-build);white-space:nowrap;font-family:var(--serif);font-weight:700;font-size:20px}
.mine{outline:1.5px solid var(--gold);outline-offset:6px;border-radius:10px}
.stack{display:grid;gap:22px}
.stk .lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.stk .lab b{font-size:15px;font-weight:500}.stk .lab span{font-family:var(--serif);font-size:26px;font-weight:700}
.seg{display:flex;height:36px;border-radius:8px;overflow:hidden;background:var(--bg)}
.seg div{height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sell{font-size:13px;color:var(--sellt);margin-top:6px}
.offset{position:absolute;top:0;height:36px;border-radius:0 8px 8px 0;border:1.5px dashed var(--sell);
 background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--card) 70%,transparent) 0 6px,color-mix(in srgb,var(--sell) 22%,transparent) 6px 12px);
 display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--sellt);white-space:nowrap}
.insight{border-left:2px solid var(--gold);background:var(--gold-soft);border-radius:0 12px 12px 0;padding:16px 18px;margin-top:20px;font-size:15px}
.insight b{display:block;margin-bottom:4px;font-family:var(--serif);font-size:18px;font-weight:700}
/* ボタン */
.nav{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:28px;flex-wrap:wrap}
.btn{min-height:52px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:0 28px;font-weight:500;font-size:16px;letter-spacing:.04em;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.red{background:var(--ishin);border-color:var(--ishin);color:var(--on-build)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
/* 結果 */
.hero-num{font-family:var(--serif);font-size:clamp(52px,9vw,104px);font-weight:800;line-height:1;color:var(--ishin);letter-spacing:-.01em;margin:4px 0 6px}
.keys{display:grid;gap:14px;grid-template-columns:1fr;margin-top:16px}
@media (min-width:760px){.keys{grid-template-columns:repeat(3,1fr)}}
.key{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.key b{display:block;font-family:var(--serif);font-size:18px;margin-bottom:6px;font-weight:700}
.key span{color:var(--muted);font-size:14px}
.hero-ph{border-radius:18px;overflow:hidden;margin:0 0 24px;aspect-ratio:16/6.5;background:var(--bg)}
.hero-ph img{width:100%;height:100%;object-fit:cover;object-position:50% 60%;display:block}
.note{color:var(--muted);font-size:12px;margin-top:auto;padding-top:16px;line-height:1.7}
[tabindex="-1"]:focus{outline:none}
.nb{display:inline-block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fallback{margin:24px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
/* 内訳ボタン・シート */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{min-height:40px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:0 14px;font-size:13px;cursor:pointer;letter-spacing:.02em}
.chip::after{content:" ›";color:var(--gold)}
.chip:hover{border-color:var(--gold)}
.scrim{position:fixed;inset:0;background:rgba(8,12,20,.45);z-index:40}
.sheet{position:fixed;z-index:50;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 32px rgba(0,0,0,.08);
 left:0;right:0;bottom:0;max-height:85vh;overflow:auto;border-radius:20px 20px 0 0;padding:24px 24px calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:860px){.sheet{left:auto;top:0;bottom:0;width:460px;max-height:none;border-radius:0;padding-top:calc(28px + env(safe-area-inset-top,0px))}}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.shead h2{font-family:var(--serif);font-size:22px;line-height:1.4;margin:0;font-weight:700}
.x{min-width:44px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer}
.mlist{list-style:none;margin:0;padding:0}
.mlist li,.dgrid>div{display:grid;grid-template-columns:1fr 96px 80px;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.mlist li:first-child,.dgrid>div:first-child{border-top:0}
.mlist b,.dgrid b{text-align:right;font-family:var(--serif);font-weight:700}
.mbar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden}.mbar i{display:block;height:100%;border-radius:3px}
.dnote{color:var(--muted);font-size:13px;margin:12px 0 0}
.plain{padding-left:20px;margin:8px 0}.plain li{margin:6px 0}
.big{font-family:var(--serif);font-size:40px;font-weight:700;margin:0 0 8px}
/* 映像で確かめる */
.clipbtn{display:inline-flex;align-items:center;gap:10px;min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px 6px 6px;cursor:pointer;text-align:left}
.clipbtn:hover{border-color:var(--gold)}
.clipbtn .play{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--navy);color:#E9D3A6;font-size:11px}
.clipbtn small{display:block;font-size:11px;color:var(--muted);letter-spacing:.02em}
.cliprow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.clip-wrap{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none}
.clip{position:relative;pointer-events:auto;width:min(760px,94vw);max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 28px 28px;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.clip-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.clip-top .src{font-size:12px;color:var(--muted);letter-spacing:.06em}
.cq{font-family:var(--serif);font-size:clamp(22px,3.2vw,30px);line-height:1.5;margin:0;font-weight:700}
.watch{margin:0;padding-left:22px;font-size:17px}.watch li{margin:6px 0}
.clip-nav{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.vid{width:100%;aspect-ratio:16/9;border-radius:14px;background:#0B1018;display:block}
.vid.v916{width:auto;max-width:100%;height:min(64vh,680px);aspect-ratio:9/16;margin:0 auto}
.ph-vid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#E9ECF2;text-align:center;padding:16px;font-family:var(--serif)}
.ph-vid .small{font-family:var(--sans);font-size:13px;color:#A8AFBC;margin:0}
.pbar{width:70%;height:3px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:14px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#E9C27A,#7FD3F0)}
.memo-t{margin-top:16px;background:transparent;border:0;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;min-height:32px;padding:0}
.memo{margin:8px 0 0;padding:12px 14px;border-radius:10px;background:var(--bg);font-size:14px}
/* トップページ */
.cover{position:relative;min-height:100vh;color:#F4F0E8;overflow:hidden;background:var(--navy)}
.cover .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 55%}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,23,38,.82) 0%,rgba(14,23,38,.45) 42%,rgba(14,23,38,0) 70%),linear-gradient(180deg,rgba(14,23,38,.35) 0%,rgba(14,23,38,0) 25%,rgba(14,23,38,.55) 70%,rgba(14,23,38,.92) 100%)}
.cover .beam{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.cover .inner{position:relative;z-index:2;max-width:1120px;margin:0 auto;min-height:100vh;padding:28px 32px 40px;display:flex;flex-direction:column}
.cover .mark{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.18em;color:rgba(244,240,232,.8)}
.cover .mark b{font-family:var(--serif);font-size:18px;letter-spacing:.08em;color:#fff;font-weight:700}
.cover .body{margin-top:auto}
.cover .kicker{font-size:12px;letter-spacing:.24em;color:#E9C27A;margin:0 0 16px}
.cover h1{font-size:clamp(30px,5.6vw,64px);line-height:1.35;color:#fff;margin:0 0 18px;letter-spacing:.04em}
.cover .sub{font-size:16px;color:rgba(244,240,232,.85);max-width:560px;margin:0 0 28px}
.cover .cta{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.cover .meta{font-size:13px;color:rgba(244,240,232,.75);letter-spacing:.06em}
.cover .three{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:40px;border-top:1px solid rgba(244,240,232,.18)}
.cover .three div{padding:16px 16px 0 0}
.cover .three b{display:block;font-family:var(--serif);font-size:16px;color:#fff;font-weight:700;margin-bottom:2px}
.cover .three span{font-size:13px;color:rgba(244,240,232,.7)}
.cover .three em{font-style:normal;font-size:11px;letter-spacing:.2em;color:#E9C27A;display:block;margin-bottom:6px}
@media (max-width:720px){.cover .three{grid-template-columns:1fr}.cover .inner{padding:20px}}

/* 結果:iPadで1画面に収める2カラム */
.result{display:grid;gap:24px;grid-template-columns:1fr}
@media (min-width:900px){.result{grid-template-columns:1fr 1.05fr;align-items:start}}
.result .hero-ph{aspect-ratio:16/8.5;margin:0 0 16px}
.result h1{font-size:clamp(24px,2.8vw,32px);margin-bottom:6px;text-wrap:balance}
.r-lead{margin:0 0 4px;font-size:14px}
.result .hero-num{font-size:clamp(52px,6.6vw,80px);margin:4px 0}
.r-h2{font-family:var(--serif);font-size:20px;margin:0 0 12px;font-weight:700}
.keyrows{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.keyrow{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--card);border:1.5px solid var(--gold);border-radius:14px;padding:12px 12px 12px 16px;
 box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 10%,transparent)}
.keyrow .kt{display:flex;flex-direction:column;min-width:0}
.keyrow .kt b{font-family:var(--serif);font-size:16px;white-space:nowrap;font-weight:700;line-height:1.35}
.keyrow .kt span{font-size:13px;color:var(--muted);line-height:1.5}
.keyrow .clipbtn{flex-shrink:0}
.r-nav{margin-top:16px}
/* 50年を早送り */
.ff{position:relative;background:#13243A;color:#F5F0E6;border-radius:20px;padding:18px 24px 16px;height:clamp(520px,calc(100dvh - 215px),760px);display:flex;flex-direction:column;gap:10px;overflow:hidden}
.ff-top{display:flex;align-items:flex-end;gap:22px}
.ff-year{display:flex;align-items:baseline;gap:6px;line-height:1}
.ff-year .n{font-size:84px;font-weight:700;color:#C3A15B;font-variant-numeric:tabular-nums;min-width:1.2em;text-align:right}
.ff-year .u{font-size:26px;font-weight:700}
.ff-top .ttl{font-size:18px;color:rgba(245,240,230,.65);padding-bottom:10px}
.ff-top .ttl b{display:block;font-size:12px;color:#C3A15B;letter-spacing:.14em;font-weight:500}
.ff-mid{flex:1;display:grid;grid-template-columns:1fr 280px;gap:18px;min-height:0}
.ff-chart{min-height:0}.ff-chart svg{width:100%;height:100%;display:block}
.ff-side{display:flex;flex-direction:column;gap:10px;justify-content:center}
.ff-row{border-radius:14px;padding:12px 16px;background:#1B3150;border-left:6px solid}
.ff-row.me{background:#24406A;box-shadow:0 0 0 2px #C3A15B inset}
.ff-row .nm{font-size:14px;color:rgba(245,240,230,.7)}
.ff-row .v{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.ff-row .v small{font-size:16px;margin-left:2px}
.ff-row .d{font-size:14px;color:#E2C989;min-height:1.3em}
.ff-bot{display:flex;align-items:center;gap:14px}
.ff-btn{min-height:48px;border-radius:999px;border:1px solid rgba(245,240,230,.2);background:#1B3150;color:#F5F0E6;padding:0 20px;font-size:16px;font-weight:700;cursor:pointer;white-space:nowrap}
.ff-btn.main{background:#C3A15B;color:#13243A;border:0;min-width:136px}
.ff-btn:disabled{opacity:.35;cursor:default}
.ff-track{flex:1;position:relative;height:40px}
.ff-track .bar,.ff-track .fl{position:absolute;left:0;top:11px;height:6px;border-radius:3px}
.ff-track .bar{right:0;background:rgba(245,240,230,.14)}.ff-track .fl{background:#C3A15B}
.ff-track .dt{position:absolute;top:6px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#13243A;border:3px solid rgba(245,240,230,.5)}
.ff-track .dt.past{border-color:#C3A15B;background:#C3A15B}
.ff-track .lb{position:absolute;top:24px;font-size:12px;color:rgba(245,240,230,.6);transform:translateX(-50%)}
.ff-veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(19,36,58,.72);z-index:4;padding:20px}
.ff-card{width:min(660px,94%);background:#F5F0E6;color:#13243A;border-radius:20px;padding:24px 28px 22px;border:4px solid #C3A15B;animation:ffpop .55s cubic-bezier(.2,.9,.3,1.25) both,ffglow 1.6s .5s ease-out}
@keyframes ffpop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes ffglow{0%{box-shadow:0 0 0 0 rgba(195,161,91,.7)}100%{box-shadow:0 0 0 26px rgba(195,161,91,0)}}
.ff-card .when{font-size:16px;font-weight:700;color:#9A7B36}
.ff-card h2{font-size:30px;margin:2px 0 8px;font-weight:700;line-height:1.3;font-family:var(--sans)}
.ff-card .ld{font-size:17px;margin:0 0 12px;line-height:1.6}
.ff-cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ff-cmp>div{border-radius:12px;padding:10px 14px;background:#EAE3D4}
.ff-cmp>div.i{background:#13243A;color:#F5F0E6}
.ff-cmp .who{font-size:13px;opacity:.75}
.ff-cmp .it{font-size:22px;font-weight:700;line-height:1.45}
.ff-cmp .none{font-size:15px;font-weight:400;opacity:.7}
.ff-card .ft{font-size:14px;margin-top:10px;opacity:.75;line-height:1.6}
.ff-card .acts{display:flex;gap:12px;align-items:center;margin-top:16px;flex-wrap:wrap}
.ff-card .nx{flex:1;min-height:52px;background:#13243A;color:#F5F0E6;border:0;border-radius:999px;padding:0 20px;font-size:19px;font-weight:700;cursor:pointer}
.ff-q{text-align:center;max-width:900px}

function Count({to, dur=0.9, decimals=0, reduce}){
  const ref = useRef(null);
  useEffect(()=>{ const el=ref.current; if(!el) return;
    if(reduce){ el.textContent = to.toLocaleString(undefined,{minimumFractionDigits:decimals,maximumFractionDigits:decimals}); return; }
    const c = animate(0, to, {duration:dur, ease:[0.16,1,0.3,1], onUpdate:v=>{ el.textContent = v.toLocaleString(undefined,{minimumFractionDigits:decimals,maximumFractionDigits:decimals}); }});
    return ()=>c.stop(); },[to]);
  return html`<span ref=${ref}>0</span>`;
}

/* 証拠カットの3段階:①見る前(問いと見どころ) ②映像 ③見た後(まとめの一言) */
function Clip({id, onClose, reduce}){
  const c = CLIPS[id]; const [stage,setStage] = useState(0); const [memo,setMemo] = useState(false);
  const [prog,setProg] = useState(0); const ref = useRef(null); const first = useRef(null);
  useEffect(()=>{ const t=setTimeout(()=>first.current&&first.current.focus(),40);
    const k=(e)=>{ if(e.key==="Escape") onClose();
      if(e.key==="Tab"&&ref.current){ const f=ref.current.querySelectorAll("button,video"); const a=f[0], z=f[f.length-1];
        if(e.shiftKey&&document.activeElement===a){e.preventDefault(); z.focus();} else if(!e.shiftKey&&document.activeElement===z){e.preventDefault(); a.focus();} } };
    window.addEventListener("keydown",k); return ()=>{clearTimeout(t); window.removeEventListener("keydown",k);}; },[stage]);
  useEffect(()=>{ if(stage!==1 || c.src) return; setProg(0);
    const st=performance.now(); let raf; const tick=(n)=>{ const p=Math.min(1,(n-st)/(c.sec*1000)); setProg(p); if(p<1) raf=requestAnimationFrame(tick); else setStage(2); };
    raf=requestAnimationFrame(tick); return ()=>cancelAnimationFrame(raf); },[stage]);
  const T = {duration:reduce?.1:.3, ease:[0.16,1,0.3,1]};
  return html`<${React.Fragment}>
    <${motion.div} class="scrim" style=${{zIndex:60}} initial=${{opacity:0}} animate=${{opacity:1}} exit=${{opacity:0}} transition=${T} onClick=${onClose}/>
    <div class="clip-wrap"><${motion.div} ref=${ref} class="clip" role="dialog" aria-modal="true" aria-labelledby="cq"
      initial=${reduce?{opacity:0}:{opacity:0,scale:.97}} animate=${{opacity:1,scale:1}} exit=${reduce?{opacity:0}:{opacity:0,scale:.97}} transition=${T}>
      <div class="clip-top"><span class="src">${c.video}|${c.ch}</span>
        <button class="x" onClick=${onClose} aria-label="映像を閉じて話に戻る">✕</button></div>
      <${AnimatePresence} mode="wait">
      ${stage===0 && html`<${motion.div} key="s0" initial=${{opacity:0}} animate=${{opacity:1}} exit=${{opacity:0}} transition=${T}>
          <p class="eyebrow">この映像で確かめること</p>
          <h2 id="cq" class="cq">${c.q}</h2>
          <p class="eyebrow" style=${{marginTop:"16px"}}>見どころ</p>
          <ol class="watch">${c.watch.map(w=>html`<li key=${w}>${w}</li>`)}</ol>
          <div class="clip-nav"><button class="btn red" ref=${first} onClick=${()=>setStage(1)}>▶ 映像を見る(約${c.sec}秒)</button>
            <button class="btn ghost" onClick=${onClose}>今は見ない</button></div>
          <button class="memo-t" aria-expanded=${memo} onClick=${()=>setMemo(v=>!v)}>${memo?"営業メモを閉じる":"営業メモ"}</button>
          ${memo && html`<p class="memo">${c.memo}</p>`}
        <//>`}
      ${stage===1 && html`<${motion.div} key="s1" initial=${{opacity:0}} animate=${{opacity:1}} exit=${{opacity:0}} transition=${T}>
          <h2 id="cq" class="sr">${c.q}</h2>
          ${c.src ? html`<video ref=${first} class="vid v916" src=${c.src} controls playsinline autoplay
               onLoadedMetadata=${e=>{ e.currentTarget.currentTime=c.start; }}
               onTimeUpdate=${e=>{ if(c.end && e.currentTarget.currentTime>=c.end){ e.currentTarget.pause(); setStage(2);} }}
               onEnded=${()=>setStage(2)}></video>`
            : html`<div class="vid ph-vid"><p><b>${c.video}</b><br/>「${c.ch}」約${c.sec}秒</p><p class="small">動画ができたら、ここで再生されます(試作の表示)</p>
               <div class="pbar"><i style=${{width:(prog*100)+"%"}}></i></div></div>`}
          <div class="clip-nav"><button class="btn ghost" ref=${c.src?null:first} onClick=${()=>setStage(2)}>見終わった</button></div>
        <//>`}
      ${stage===2 && html`<${motion.div} key="s2" initial=${reduce?{opacity:0}:{opacity:0,y:8}} animate=${{opacity:1,y:0}} exit=${{opacity:0}} transition=${T}>
          <p class="eyebrow">つまり</p>
          <h2 id="cq" class="cq">${c.after}</h2>
          <div class="clip-nav"><button class="btn" ref=${first} onClick=${onClose}>話に戻る</button>
            <button class="btn ghost" onClick=${()=>setStage(1)}>もう一度見る</button></div>
        <//>`}
      <//>
    <//></div>
  <//>`;
}

        <div class="lab"><b>${HOUSES[k].name}${k===pick?"(あなた)":""}</b><span style=${{color:HOUSES[k].color}}><${Count} to=${HOUSES[k].total} reduce=${reduce}/>万円</span></div>
        <div style=${{position:"relative"}}>
          ${k==="ishin" && !reduce ? html`<div class="seg">
              ${seg(k,"build",HOUSES[k].color,"建物・利子・オプション",i)}
              <${motion.div} key="ifbuy" class="ifbuy" style=${{background:"var(--elec)",color:"#1D2230"}}
                initial=${{width:0}} animate=${{width:["0%",(GAIN_ELEC/max*100)+"%",(GAIN_ELEC/max*100)+"%","0%"]}}
                transition=${{duration:2.6,times:[0,.35,.6,1],delay:.5,ease:"easeInOut"}}>電気代<//>
              ${seg(k,"maint","var(--maint)","メンテ",i)}</div>
            <${motion.div} aria-hidden="true" class="ifbuy-tag" style=${{left:((HOUSES.ishin.total+GAIN_ELEC+GAIN_SELL)/max*100)+"%"}}
              initial=${{opacity:0}} animate=${{opacity:[0,1,1,0]}} transition=${{duration:2.4,times:[0,.2,.7,1],delay:.9}}>電気を買う家なら 約${(HOUSES.ishin.total+GAIN_ELEC+GAIN_SELL).toLocaleString()}万円<//>`
          : html`<div class="seg">${[seg(k,"build",HOUSES[k].color,"建物・利子・オプション",i),seg(k,"elec","var(--elec)","電気代",i),seg(k,"maint","var(--maint)","メンテ",i)]}</div>`}
          ${HOUSES[k].sell ? html`<${motion.div} aria-hidden="true" class="offset"
              style=${{left:((HOUSES[k].build+HOUSES[k].elec+HOUSES[k].maint-HOUSES[k].sell)/max*100)+"%", width:(HOUSES[k].sell/max*100)+"%"}}
              initial=${{opacity:0}} animate=${{opacity:1}} transition=${{duration:reduce?0:.3, delay:reduce?0:(k==="ishin"?3.0:1.0)}}>売電で相殺<//>` : null}
        </div>
        ${HOUSES[k].sell ? html`<div class="sell">点線の部分(売電収入 ${HOUSES[k].sell}万円)を差し引いた合計です</div>` : null}
        ${k==="ishin" ? html`<${motion.div} class="ifbuy-note" initial=${{opacity:0,y:6}} animate=${{opacity:1,y:0}} transition=${{delay:reduce?0:3.2,duration:.4}}>
            電気を買う家(ZEH住宅の例)なら約${(HOUSES.ishin.total+GAIN_ELEC+GAIN_SELL).toLocaleString()}万円。電気代0円と売電収入${GAIN_SELL}万円で、<b>約${(GAIN_ELEC+GAIN_SELL).toLocaleString()}万円</b>少なくなります。<//>` : null}
        <div class="chips">
          <button class="chip" onClick=${(e)=>onOpen({k,part:"build"},e)}>建物・利子・オプション</button>
          ${HOUSES[k].elec ? html`<button class="chip" onClick=${(e)=>onOpen({k,part:"elec"},e)}>電気代 ${HOUSES[k].elec.toLocaleString()}万円</button>` : html`<button class="chip" onClick=${(e)=>onOpen({k,part:"elec"},e)}>電気のゆくえ</button>`}
          <button class="chip" onClick=${(e)=>onOpen({k,part:"maint"},e)}>メンテ ${HOUSES[k].maint.toLocaleString()}万円の内訳</button>
          ${HOUSES[k].sell ? html`<button class="chip" onClick=${(e)=>onOpen({k,part:"sell"},e)}>売電収入 ${HOUSES[k].sell}万円</button>` : null}
        </div>
      </div>`)}</div>
      <div class="legend"><span><i style=${{background:"var(--low)"}}></i>建物・利子・オプション(色は家ごと)</span><span><i style=${{background:"var(--elec)"}}></i>電気代</span><span><i style=${{background:"var(--maint)"}}></i>メンテナンス費</span></div>
      <div class="insight"><b>${pick==="ishin" ? "50年で、ほかの家より約3,100〜3,800万円少ない" : `${HOUSES[pick].name}は、イシンホームより約${(HOUSES[pick].total-HOUSES.ishin.total).toLocaleString()}万円多い`}</b>${WHY[pick]}</div>
    </div></div>`;
}

function Detail({open, onClose, reduce, onClip}){
  const ref = useRef(null); const closeRef = useRef(null);
  useEffect(()=>{ if(!open) return;
    const t=setTimeout(()=>closeRef.current&&closeRef.current.focus(),30);
    const k=(e)=>{ if(e.key==="Escape") onClose();
      if(e.key==="Tab"&&ref.current){ const f=ref.current.querySelectorAll("button"); const a=f[0], z=f[f.length-1];
        if(e.shiftKey&&document.activeElement===a){e.preventDefault(); z.focus();} else if(!e.shiftKey&&document.activeElement===z){e.preventDefault(); a.focus();} } };
    window.addEventListener("keydown",k); return ()=>{clearTimeout(t); window.removeEventListener("keydown",k);}; },[open]);
  if(!open) return null;
  const H = HOUSES[open.k]; const isI = open.k==="ishin";
  let title="", body=null;
  if(open.part==="maint"){
    const m = isI ? MAINT.ishin : MAINT.other; const max = 300;
    title = `${H.name}のメンテナンス費(50年間)`;
    body = html`<ul class="mlist">${m.items.map(([n,v],i)=>html`<li key=${n}><span>${n}</span>
        <span class="mbar"><${motion.i} style=${{background:isI?"var(--ishin)":"var(--maint)"}} initial=${{width:0}} animate=${{width:(v/max*100)+"%"}} transition=${{duration:reduce?0:.5,delay:reduce?0:i*.04}}/></span>
        <b>${v}万円</b></li>`)}</ul>
      <p class="dnote">${m.note}</p>
      ${!isI ? html`<p class="dnote">ローコスト住宅とZEH住宅は、同じ「他社メーカー」のメンテナンス費の試算を使っています。</p>` : null}
      <div class="cliprow"><${ClipBtn} id="maint" onClip=${onClip}/><${ClipBtn} id="wood" onClip=${onClip}/></div>`;
  } else if(open.part==="elec"){
    const d = DAY[open.k]; const max = 55;
    title = `${H.name}の1日の電気のゆくえ`;
    body = html`<div class="dgrid">${[["発電する電気",d.gen,"var(--elec)"],["電力会社から買う電気",d.buy,"var(--low)"],["余って売る電気",d.sell,"var(--sell)"]].map(([n,v,c],i)=>html`
        <div key=${n}><span>${n}</span><span class="mbar"><${motion.i} style=${{background:c}} initial=${{width:0}} animate=${{width:(v/max*100)+"%"}} transition=${{duration:reduce?0:.5,delay:reduce?0:i*.06}}/></span><b>${v===0 && isI && n.includes("買う") ? "ほぼ0" : v.toFixed(1)+" kWh"}</b></div>`)}</div>
      <p class="dnote">${d.note}</p>
      ${H.elec ? html`<p class="dnote">50年間の電気代は ${H.elec.toLocaleString()}万円の試算です。</p>` : html`<p class="dnote">電気代は売電収入とほぼ相殺されるため、50年累計の電気代は0として試算しています。</p>`}
      <p class="dnote">年間平均の目安(家で使う電気13kWh/日)。発電量は全国平均1,205kWh/kW・年で計算。</p>
      <div class="cliprow"><${ClipBtn} id="elec" onClip=${onClip}/></div>`;
  } else if(open.part==="sell"){
    title = "売電収入 500万円(50年間)";
    body = html`<p>使い切れずに余った電気を売った収入の試算です。50年累計から差し引いています。</p>
      <ul class="plain"><li>売電単価は下がってきました(住宅用:2012年度42円 → 2025年度上期15円/kWh)。</li>
      <li>2025年10月以降の新しい契約は、最初の4年が24円、5〜10年目が8.3円です。</li>
      <li>だからこそ、売るより「使い切る」設計が大切になっています。</li></ul>
      <p class="dnote">売電収入は、天候・設置条件・制度によって変わり、保証されるものではありません。</p>`;
  } else {
    title = `${H.name}の建物・利子・オプション`;
    body = html`<p class="big">${H.build.toLocaleString()}万円</p>
      <p>${isI ? "エネルギー6点セットと、桧の柱・土台などの材料を標準装備した建物価格に、住宅ローンの利子を含みます。オプションが少ない設計です。" :
        open.k==="zeh" ? "建物価格に住宅ローンの利子と、蓄電池などのオプション費用を含みます。" : "建物価格を抑えた分、設備の多くがオプションになります。住宅ローンの利子を含みます。"}</p>
      <p class="dnote">建物価格・利子・オプションの細かい内訳は、試算資料で確認中です。</p>
      <div class="cliprow"><${ClipBtn} id="option" onClip=${onClip}/></div>`;
  }
  return html`<${React.Fragment}>
    <${motion.div} class="scrim" onClick=${onClose} initial=${{opacity:0}} animate=${{opacity:1}} exit=${{opacity:0}} transition=${{duration:reduce?.1:.2}}/>
    <${motion.div} ref=${ref} class="sheet" role="dialog" aria-modal="true" aria-labelledby="dt"
      initial=${reduce?{opacity:0}:{y:40,opacity:0}} animate=${{y:0,opacity:1}} exit=${reduce?{opacity:0}:{y:40,opacity:0}} transition=${{duration:reduce?.1:.3,ease:[0.16,1,0.3,1]}}>
      <div class="shead"><h2 id="dt">${title}</h2><button class="x" ref=${closeRef} onClick=${onClose} aria-label="内訳を閉じる">✕</button></div>
      ${body}
    <//>
  <//>`;
}

function Step3({pick, reduce, onRestart, onClip}){
  const diff = pick==="ishin" ? null : HOUSES[pick].total - HOUSES.ishin.total;
  const KEYS = [["高い設備と材料","6点セットと、長持ちする桧の柱・土台","wood"],
                ["電気代込みの支払いが最小","電気を使い切り、余りを売る設計","why_month"],
                ["フル標準装備","あとからオプションで高くならない","option"],
                ["災害のときも、暮らしと家計を守る","地震・水害・停電への7つの備え","safety"]];
  return html`<div class="result">
    <div class="r-left">
      <${motion.div} class="hero-ph" initial=${reduce?{opacity:0}:{opacity:0,scale:1.03}} animate=${{opacity:1,scale:1}} transition=${{duration:reduce?.1:.6,ease:[0.16,1,0.3,1]}}>
        <img src=${PHOTO.ishin} alt="イシンホームの外観のイメージ(大容量ソーラーを載せた平屋)"/><//>
      <p class="eyebrow">STEP 5|結論</p><h1>${pick==="ishin" ? "その選択で、50年の安心まで。" : "50年で考えると、答えが変わります。"}</h1>
      ${diff!==null ? html`<p class="lead r-lead">${HOUSES[pick].name}を選んだ場合と比べて、50年間で</p>
          <div class="hero-num" aria-live="polite">約<${Count} to=${diff} dur=${1.2} reduce=${reduce}/>万円</div><p class="lead r-lead">の差が出る試算です。</p>`
        : html`<p class="lead r-lead">建てる時だけでなく、住み続ける50年の支払いまで小さくする家です。</p>`}
    </div>
    <div class="r-right">
      <h2 class="r-h2">イシンホームの決め手</h2>
      <ul class="keyrows">${KEYS.map(([t,d,cid],i)=>html`
        <${motion.li} key=${t} class="keyrow" initial=${reduce?{opacity:0}:{opacity:0,x:12}} animate=${{opacity:1,x:0}} transition=${{duration:reduce?.1:.3,delay:reduce?0:.3+i*.03,ease:[0.16,1,0.3,1]}}>
          <span class="kt"><b>${t}</b><span>${d}</span></span>
          <${ClipBtn} id=${cid} onClip=${onClip}/><//>`)}</ul>
      <div class="nav r-nav"><button class="btn ghost" onClick=${onRestart}>ほかの家でも比べる</button>
        <button class="btn red" onClick=${()=>alert("店舗のAI+FP計算で、ご家族の条件に合わせて計算できます。")}>あなたの家族の場合を計算する</button></div>
    </div>
  </div>`;
}


function Cover({onStart, reduce}){
  return html`<section class="cover" aria-labelledby="ct">
    <img class="bgimg" src=${HERO} alt=""/>
    <svg class="beam" viewBox="0 0 1200 800" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#F2C982"/><stop offset=".55" stop-color="#FFF4DC"/><stop offset="1" stop-color="#8FDCF5"/></linearGradient>
        <filter id="gl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      <${motion.path} d="M -20 520 C 220 470, 380 300, 610 250 S 980 330, 1240 210" fill="none" stroke="url(#bg)" stroke-width="2.5" filter="url(#gl)"
        initial=${reduce?{pathLength:1,opacity:.8}:{pathLength:0,opacity:0}} animate=${{pathLength:1,opacity:.9}} transition=${{duration:reduce?0:2.2,ease:[0.16,1,0.3,1],delay:reduce?0:.3}}/>
      <${motion.path} d="M -20 560 C 260 520, 420 360, 640 300 S 1000 380, 1240 270" fill="none" stroke="url(#bg)" stroke-width="1.2" opacity=".6"
        initial=${reduce?{pathLength:1}:{pathLength:0}} animate=${{pathLength:1}} transition=${{duration:reduce?0:2.6,ease:[0.16,1,0.3,1],delay:reduce?0:.6}}/>
    </svg>
    <div class="inner">
      <div class="mark"><b>ISHIN HOME</b><span>50年の支払いくらべ</span></div>
      <div class="body">
        <${motion.div} initial=${reduce?{opacity:0}:{opacity:0,y:16}} animate=${{opacity:1,y:0}} transition=${{duration:reduce?.1:.6,ease:[0.16,1,0.3,1],delay:reduce?0:.2}}>
          <p class="kicker">ENERGY 6 SET / 50 YEARS</p>
          <h1 id="ct"><span class="nb">建てた日だけでなく、</span><br/><span class="nb">50年後の暮らしまで、</span><br/><span class="nb">軽くする家。</span></h1>
          <p class="sub">ローコスト住宅・ZEH住宅・イシンホーム。3つの家の、毎月の支払いと50年間の合計を、いっしょに比べてみましょう。</p>
          <div class="cta"><button class="btn gold" onClick=${onStart}>比べてみる</button><span class="meta">約4分・3つの家を比べる</span></div>
        <//>
        <div class="three">
          ${[["01","毎月の支払い","建ててすぐの月々"],["02","50年を早送り","住んでからの支払いの積み上がり"],["03","何が違うのか","映像で確かめる"]].map(([n,b,s_],i)=>html`
            <${motion.div} key=${n} initial=${{opacity:0}} animate=${{opacity:1}} transition=${{duration:reduce?.1:.4,delay:reduce?0:.8+i*.08}}><em>${n}</em><b>${b}</b><span>${s_}</span><//>`)}
        </div>
      </div>
    </div>
  </section>`;
}

function App(){
  const reduce = useReducedMotion();
  const [step,setStep] = useState(-1); const [pick,setPick] = useState(null);
  const [detail,setDetail] = useState(null); const opener = useRef(null);
  const openDetail = (d,e)=>{ opener.current = e && e.currentTarget; setDetail(d); };
  const [clip,setClip] = useState(null); const clipOpener = useRef(null);
  const openClip = (id,e)=>{ clipOpener.current = e && e.currentTarget; setClip(id); };
  const closeClip = ()=>{ setClip(null); setTimeout(()=>clipOpener.current && clipOpener.current.focus(), 50); };
  const closeDetail = ()=>{ setDetail(null); setTimeout(()=>opener.current && opener.current.focus(), 50); };
  const head = useRef(null);
  useEffect(()=>{ window.scrollTo(0,0); const h=document.querySelector("h1"); if(h){ h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); } },[step]);
  const T = {duration:reduce?.1:.3, ease:[0.16,1,0.3,1]};
  if(step===-1) return html`<${Cover} reduce=${reduce} onStart=${()=>setStep(0)}/>`;
  return html`<div class="app">
    <div class="top"><button class="brand" onClick=${()=>{setPick(null); setStep(-1);}} aria-label="トップページへ"><b>ISHIN HOME</b><span>50年の支払いくらべ</span></button>
      <ol class="steps-ind" aria-label=${"全5ステップ中 "+(step+1)+" ステップ目"}>${["家を選ぶ","毎月","早送り","50年","結論"].map((l,i)=>html`<li key=${l} class=${i<=step?"on":""} aria-current=${i===step?"step":undefined}><span>${l}</span></li>`)}</ol></div>
    <${AnimatePresence} mode="wait">
      <${motion.main} key=${step} initial=${reduce?{opacity:0}:{opacity:0,x:24}} animate=${{opacity:1,x:0}} exit=${reduce?{opacity:0}:{opacity:0,x:-24}} transition=${T}>
        ${step===0 && html`<${Step0} reduce=${reduce} onPick=${k=>{setPick(k); setStep(1);}}/>`}
        ${step===1 && html`<${Step1} pick=${pick} reduce=${reduce} onClip=${openClip}/>`}
        ${step===2 && html`<${FastForward} pick=${pick} reduce=${reduce} onClip=${openClip} onBack=${()=>setStep(1)} onNext=${()=>setStep(3)}/>`}
        ${step===3 && html`<${Step2} pick=${pick} reduce=${reduce} onOpen=${openDetail}/>`}
        ${step===4 && html`<${Step3} pick=${pick} reduce=${reduce} onClip=${openClip} onRestart=${()=>{setPick(null); setStep(0);}}/>`}
      <//>
    <//>
    ${step>0 && step<4 && step!==2 && html`<div class="nav">
      <button class="btn ghost" onClick=${()=>setStep(s=>s-1)}>戻る</button>
      <button class="btn" onClick=${()=>setStep(s=>s+1)}>${step===1?"50年たつと?":"結果を見る"}</button></div>`}
    <${AnimatePresence}>${detail && html`<${Detail} key="d" open=${detail} onClose=${closeDetail} reduce=${reduce} onClip=${openClip}/>`}<//>
    <${AnimatePresence}>${clip && html`<${Clip} key="c" id=${clip} onClose=${closeClip} reduce=${reduce}/>`}<//>
    <p class="note">金額はイシンホームの試算例です(土地代を除く)。50年累計は、建物・利子・オプション、電気代、メンテナンス費の合計で、イシンホームは売電収入を差し引いています。プラン・地域・電気の使い方・売電条件によって結果は変わり、売電収入を保証するものではありません。</p>
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script></body></html>
